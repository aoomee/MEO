name: Build release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            miaomiaowux/go.sum
            mmw-agent/go.sum
            xray-core-vision-limiter/go.sum

      - name: Build panel
        working-directory: miaomiaowux
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o ../release/mmwx-linux-${GOARCH} ./cmd/server

      - name: Build agent
        working-directory: mmw-agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o ../release/mmwx-agent-linux-${GOARCH} ./cmd/mmw-agent

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --generate-notes

          for rolling_tag in mmwx mmwx-agent; do
            if gh release view "${rolling_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${rolling_tag}" release/* \
                --repo "${GITHUB_REPOSITORY}" --clobber
              gh release edit "${rolling_tag}" --repo "${GITHUB_REPOSITORY}" \
                --title "${GITHUB_REF_NAME}"
            else
              gh release create "${rolling_tag}" release/* \
                --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
                --title "${GITHUB_REF_NAME}" \
                --notes "Rolling release generated from ${GITHUB_REF_NAME}."
            fi
          done
