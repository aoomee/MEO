      // Vite 开发服务器不会经过 Go 的首屏注入。标题保持为空，等公开品牌接口
      // 返回后再显示自定义标题或默认名称，避免加载过程中先闪出内置品牌。
      if (document.title.startsWith('__MMW_')) document.title = ''
      var initialIcon = document.getElementById('mmwx-favicon')
      if (initialIcon && initialIcon.href.indexOf('__MMW_') !== -1)
        initialIcon.href = '/images/meo-mark.png'
    </script>

  <body>
    <script>
      ;(function () {
        var root = document.documentElement
        function lockMinimalTheme() {
          Array.from(root.classList).forEach(function (name) {
            if (name.indexOf('theme-') === 0 && name !== 'theme-flat' && name !== 'theme-minimal') {
              root.classList.remove(name)
            }
          })
          root.classList.add('theme-flat', 'theme-minimal')
        }
        document.cookie = 'mmw-theme-style=flat; Path=/; SameSite=Lax'
        lockMinimalTheme()
        new MutationObserver(function () {
          if (
            Array.from(root.classList).some(function (name) {
              return name.indexOf('theme-') === 0 && name !== 'theme-flat' && name !== 'theme-minimal'
            }) ||
            !root.classList.contains('theme-flat') ||
            !root.classList.contains('theme-minimal')
          ) lockMinimalTheme()
        }).observe(root, { attributes: true, attributeFilter: ['class'] })
      })()
    </script>
    <div id="root"></div>
  </body>
